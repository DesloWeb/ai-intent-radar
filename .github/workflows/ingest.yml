name: Auto Ingest HN Signals

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:         # Allow manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Login and get token
        id: auth
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.API_URL }}/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${{ secrets.API_EMAIL }}\",\"password\":\"${{ secrets.API_PASSWORD }}\"}")
          TOKEN=$(echo $RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Ingest HN signals (10-12 intents)
        run: |
          curl -s -X POST "${{ secrets.API_URL }}/signals/ingest/hn?limit_stories=10&limit_comments=5" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}"

      - name: Process signals through AI pipeline
        run: |
          curl -s -X POST "${{ secrets.API_URL }}/signals/process?limit=20" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}"

      - name: Done
        run: echo "Ingest complete at $(date)"
